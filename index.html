<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>چی بپزم؟ | پیشنهاد غذا با تاریخچه و ارزش غذایی</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#ff6b4a">
<link rel="stylesheet" href="style.css">

</head>
<body>
<div id="bg"></div>

<header>
  <div class="logo">🍳</div>
  <h1>چی <span>بپزم؟</span></h1>
  <p class="sub">مواد داخل یخچال را وارد کن تا از بین <b id="recipeCount"></b> غذای ایرانی و جهانی، بهترین پیشنهادها را ببینی.</p>
  <div class="badges">
    <span>🧊 ورود مواد</span>
    <span>🧠 تطبیق هوشمند</span>
    <span>🍽️ <b id="badgeRecipeCount"></b> غذا</span>
    <span>📜 تاریخچه و ارزش غذایی</span>
  </div>
</header>

<main>
  <aside class="panel fridge">
    <h2>🧊 یخچال من <small id="fridgeCount">۰</small></h2>

    <div class="input-wrap">
      <div class="input-row">
        <input id="ingInput" type="text" placeholder="مثلاً: تخم‌مرغ، برنج، قارچ..." autocomplete="off">
        <button id="addBtn" class="add-btn" type="button">+</button>
      </div>
      <div id="sugg" class="sugg"></div>
    </div>

    <div id="chips" class="chips"></div>
    <p id="pantryNote" class="pantry-note">🧂 چاشنی پایه به‌صورت خودکار موجود فرض شده است.</p>

    <label class="switch-row">
      <span>چاشنی پایه (نمک، فلفل، زردچوبه، روغن)</span>
      <span class="switch">
        <input type="checkbox" id="pantryToggle" checked>
        <span class="slider"></span>
      </span>
    </label>

    <div id="packs" class="packs"></div>
    <button id="clearAll" class="clear-btn">🗑️ پاک کردن همه مواد</button>
    <p id="stats" class="stats"></p>
  </aside>

  <section class="panel results">
    <div class="toolbar">
      <div class="tabs" id="tabs">
        <button class="tab active" data-tab="all">همه <b id="cAll">۰</b></button>
        <button class="tab" data-tab="full">آماده پخت <b id="cFull">۰</b></button>
        <button class="tab" data-tab="near">تقریباً <b id="cNear">۰</b></button>
        <button class="tab" data-tab="low">کمبود داره <b id="cLow">۰</b></button>
      </div>

      <select id="sortSel" class="sort">
        <option value="best">مرتب‌سازی: بهترین پیشنهاد</option>
        <option value="fast">مرتب‌سازی: سریع‌ترین</option>
        <option value="easy">مرتب‌سازی: آسان‌ترین</option>
      </select>
    </div>

    <div class="toolbar">
      <div id="tagbar" class="tagbar"></div>
    </div>

    <div id="grid" class="grid"></div>
    <div id="empty" class="empty"></div>
  </section>
</main>

<div id="modal" class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
  <div class="modal-card">
    <button id="modalClose" class="close modal-close" type="button" aria-label="بستن">×</button>
    <div id="modalBody"></div>
  </div>
</div>

<footer>ساخته‌شده با 🧈، کمی زعفران و کلی ایده برای آشپزخانه تو ✨</footer>

<script src="script.js"></script>

</body>
</html>
